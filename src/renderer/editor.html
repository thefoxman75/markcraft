<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'"
    />
    <title>Markcraft</title>
    <link rel="stylesheet" href="./common/base.css" />
    <link rel="stylesheet" href="./editor/editor.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="group" id="tools" role="toolbar" aria-label="Tools"></div>
      <div class="spacer"></div>
      <div class="group actions" id="actions" role="toolbar" aria-label="Document actions"></div>
    </header>

    <div id="crop-bar" class="notice" hidden>
      <span>Drag to adjust the crop area.</span>
      <button id="crop-apply" class="primary">Crop</button>
      <button id="crop-cancel">Cancel</button>
    </div>

    <main id="stage">
      <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="canvas-bounds" aria-label="Canvas resize handles">
          <button class="canvas-handle nw" data-handle="nw" aria-label="Resize canvas from top left"></button>
          <button class="canvas-handle n" data-handle="n" aria-label="Resize canvas from top"></button>
          <button class="canvas-handle ne" data-handle="ne" aria-label="Resize canvas from top right"></button>
          <button class="canvas-handle e" data-handle="e" aria-label="Resize canvas from right"></button>
          <button class="canvas-handle se" data-handle="se" aria-label="Resize canvas from bottom right"></button>
          <button class="canvas-handle s" data-handle="s" aria-label="Resize canvas from bottom"></button>
          <button class="canvas-handle sw" data-handle="sw" aria-label="Resize canvas from bottom left"></button>
          <button class="canvas-handle w" data-handle="w" aria-label="Resize canvas from left"></button>
        </div>
      </div>
    </main>

    <aside id="side-panel" aria-label="Editor sidebar">
      <div id="properties-panel">
        <div class="panel-head">
          <div>
            <span class="eyebrow">Tool properties</span>
            <strong id="properties-title">Arrow</strong>
          </div>
        </div>
        <div class="panel-body">
          <section id="selection-section" class="property-section selection-section" hidden>
            <div class="selection-metrics" aria-label="Selection position and size">
              <span><small>X</small><output id="selection-x">0</output></span>
              <span><small>Y</small><output id="selection-y">0</output></span>
              <span><small>W</small><output id="selection-width">0</output></span>
              <span><small>H</small><output id="selection-height">0</output></span>
            </div>
            <div class="selection-actions" aria-label="Selection actions">
              <button id="selection-duplicate" title="Duplicate (Ctrl+D)">Duplicate</button>
              <button id="selection-front" title="Bring to front">To Front</button>
              <button id="selection-back" title="Send to back">To Back</button>
              <button id="selection-delete" class="danger" title="Delete">Delete</button>
            </div>
          </section>
          <section id="quick-styles-section" class="property-section">
            <h2>Quick Styles</h2>
            <div id="quick-styles" class="quick-styles" aria-label="Quick styles"></div>
          </section>
          <section id="color-section" class="property-section">
            <h2>Color</h2>
            <div class="group swatches" id="swatches" aria-label="Color"></div>
          </section>
          <section id="width-section" class="property-section">
            <label class="property-label" for="width"><span>Width</span><output id="width-value">5 px</output></label>
            <input id="width" type="range" min="1" max="24" value="5" />
          </section>
          <section id="font-size-section" class="property-section">
            <label class="property-label" for="font-size"><span>Text size</span><output id="font-size-value">36 px</output></label>
            <input id="font-size" type="range" min="12" max="120" value="36" />
          </section>
          <p id="property-help" class="property-help"></p>
        </div>
      </div>

      <div id="ocr-panel" hidden>
        <div class="panel-head">
          <div>
            <span class="eyebrow">Grab Text</span>
            <strong>Recognized text</strong>
          </div>
          <button id="ocr-close" class="icon-button" title="Back to tool properties" aria-label="Back to tool properties">✕</button>
        </div>
        <textarea id="ocr-text" spellcheck="false"></textarea>
        <div class="panel-foot">
          <span id="ocr-status"></span>
          <button id="ocr-copy" class="primary">Copy Text</button>
        </div>
      </div>
    </aside>

    <footer class="statusbar">
      <span id="dims"></span>
      <span id="message"></span>
      <div class="spacer"></div>
      <button id="zoom-out" title="Zoom out">−</button>
      <button id="zoom-label" title="Fit to window">100%</button>
      <button id="zoom-in" title="Zoom in">+</button>
    </footer>
    <script type="module" src="./editor/main.ts"></script>
  </body>
</html>
